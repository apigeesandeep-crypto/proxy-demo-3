name: Apigee Proxy CI/CD

on:
  push:
    branches:
      - mai
    paths:
      - 'scripts/generate_xml.py'
      - 'apiproxy/**/*.xml'
      - '.github/workflows/deploy.yml'

env:
  PROXY_NAME: my-proxy-with-quota
  BUNDLE_ZIP: proxy-bundle.zip
  PYTHON_VER: '3.11'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — SCAFFOLD
# Creates the apiproxy/ directory tree via create_structure.py.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  scaffold:
    name: 1 · Scaffold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Run create_structure.py
        run: python scripts/create_structure.py

      - name: Upload scaffolded tree
        uses: actions/upload-artifact@v4
        with:
          name: scaffolded-proxy
          path: apiproxy/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — GENERATE XML & SYNC REPO
# Runs generate_xml.py to (re)write all XML files from the constants defined
# at the top of that script, then commits and pushes any changes back to main
# so the repository always matches exactly what was deployed to Apigee.
# ─────────────────────────────────────────────────────────────────────────────
  generate:
    name: 2 · Generate XML & sync repo
    needs: scaffold
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Download scaffolded tree
        uses: actions/download-artifact@v4
        with:
          name: scaffolded-proxy
          path: apiproxy/

      - name: Run generate_xml.py
        run: python scripts/generate_xml.py

      - name: Commit & push generated XML to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apiproxy/
          git add scripts/generate_xml.py

          if git diff --cached --quiet; then
            echo "==> No XML changes to commit."
          else
            git commit -m "chore(proxy): regenerate XML [skip ci]

          Triggered by : ${{ github.sha }}
          Proxy        : ${{ env.PROXY_NAME }}
          Workflow run : ${{ github.workflow }} #${{ github.run_number }}
          Actor        : ${{ github.actor }}"

            git push origin HEAD:main
            echo "==> XML changes pushed to main."
          fi

      - name: Upload generated proxy bundle
        uses: actions/upload-artifact@v4
        with:
          name: generated-proxy
          path: apiproxy/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — LINT
# Runs apigeelint against the generated bundle.  Fails before Apigee is
# touched if any policy or structure rule is violated.
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 3 · Apigee lint
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download generated proxy
        uses: actions/download-artifact@v4
        with:
          name: generated-proxy
          path: apiproxy/

      - name: Install apigeelint
        run: npm install -g apigeelint

      - name: Lint proxy bundle
        run: |
          apigeelint \
            -s apiproxy/ \
            -f table.js \
            --maxWarnings 10

      - name: Upload lint-passed proxy
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: apiproxy/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — PACKAGE
# Zips the linted apiproxy/ bundle into proxy-bundle.zip.
# ─────────────────────────────────────────────────────────────────────────────
  package:
    name: 4 · Package zip
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download lint-passed proxy
        uses: actions/download-artifact@v4
        with:
          name: lint-report
          path: apiproxy/

      - name: Create proxy bundle zip
        run: |
          cd apiproxy
          zip -r ../${{ env.BUNDLE_ZIP }} .
          cd ..
          echo "==> Bundle contents:"
          unzip -l ${{ env.BUNDLE_ZIP }}

      - name: Upload proxy zip bundle
        uses: actions/upload-artifact@v4
        with:
          name: proxy-zip-bundle
          path: ${{ env.BUNDLE_ZIP }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — DEPLOY
# Authenticates to GCP via Workload Identity Federation (keyless — no JSON key
# stored anywhere), imports the zip to Apigee (auto-increments revision),
# deploys to the eval environment, and prints a deployment summary.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 5 · Deploy to Apigee Eval (Keyless Auth)
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation (keyless)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download zipped proxy bundle
        uses: actions/download-artifact@v4
        with:
          name: proxy-zip-bundle

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Import proxy bundle to Apigee
        id: import
        run: |
          echo "==> Importing ${{ env.BUNDLE_ZIP }} to Apigee org: ${{ secrets.APIGEE_ORG }} ..."
          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=${{ env.PROXY_NAME }}&validate=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${{ env.BUNDLE_ZIP }}")

          echo "==> Import response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          REVISION=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('revision', data.get('name', '').split('/')[-1]))
          " 2>/dev/null || echo "1")

          echo "==> Revision: $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy proxy revision to eval environment
        run: |
          REVISION="${{ steps.import.outputs.revision }}"
          echo "==> Deploying revision $REVISION to env: ${{ secrets.APIGEE_ENV }} ..."

          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/revisions/${REVISION}/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Length: 0")

          echo "==> Deployment response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          STATE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('state', 'UNKNOWN'))
          " 2>/dev/null || echo "UNKNOWN")

          echo "==> State: $STATE"
          if [ "$STATE" = "READY" ] || [ "$STATE" = "PROGRESSING" ]; then
            echo "==> Deployment initiated successfully."
          else
            echo "::warning:: Deployment state '$STATE' - verify in Apigee console."
          fi

      - name: Verify deployment status
        run: |
          echo "==> Verifying ..."
          RESPONSE=$(curl -s \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/deployments" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}")

          echo "==> Deployment status:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

      - name: Deployment summary
        run: |
          echo ""
          echo "=================================================="
          echo "  Proxy Name  : ${{ env.PROXY_NAME }}"
          echo "  Org         : ${{ secrets.APIGEE_ORG }}"
          echo "  Environment : ${{ secrets.APIGEE_ENV }}"
          echo "  Revision    : ${{ steps.import.outputs.revision }}"
          echo "  Triggered by: ${{ github.actor }}"
          echo "  Commit SHA  : ${{ github.sha }}"
          echo "=================================================="
