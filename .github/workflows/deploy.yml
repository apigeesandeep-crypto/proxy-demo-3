name: Apigee Proxy CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'apiproxy/**'
      - '.github/workflows/deploy.yml'

env:
  PROXY_NAME: my-proxy-with-quota
  BUNDLE_ZIP: proxy-bundle.zip
  PYTHON_VER: '3.11'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — GENERATE PROXY STRUCTURE + XML
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  generate:
    name: 1 · Scaffold & Generate XML
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Run scaffold script
        run: |
          echo "==> Running create_structure.py ..."
          python scripts/create_structure.py .

      - name: Run XML generator
        run: |
          echo "==> Running generate_xml.py ..."
          python scripts/generate_xml.py .

      - name: Verify generated files
        run: |
          echo "==> apiproxy structure:"
          find apiproxy -type f | sort

      - name: Commit & push generated proxy files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apiproxy/
          git add scripts/

          if git diff --cached --quiet; then
            echo "==> No changes to commit."
          else
            git commit -m "ci: regenerate Apigee proxy bundle [skip ci]"
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:main
            echo "==> Changes pushed successfully."
          fi

      - name: Upload proxy source artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-bundle-src
          path: apiproxy/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — APIGEE LINT
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 2 · Apigee Lint
    runs-on: ubuntu-latest
    needs: generate

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download proxy source artifact
        uses: actions/download-artifact@v4
        with:
          name: proxy-bundle-src
          path: apiproxy/

      - name: Verify downloaded files
        run: |
          echo "==> Downloaded proxy files:"
          find apiproxy -type f | sort

      - name: Install apigeelint
        run: npm install -g apigeelint

      - name: Run apigeelint
        run: |
          echo "==> Running apigeelint ..."
          apigeelint \
            -s apiproxy \
            -f table.js \
            --profile apigee \
            --maxWarnings 10

      - name: Upload linted proxy source
        uses: actions/upload-artifact@v4
        with:
          name: linted-proxy-src
          path: apiproxy/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — PACKAGE PROXY BUNDLE
# ─────────────────────────────────────────────────────────────────────────────
  package:
    name: 3 · Package Proxy Bundle
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download linted proxy source
        uses: actions/download-artifact@v4
        with:
          name: linted-proxy-src
          path: apiproxy/

      - name: Verify proxy structure
        run: |
          echo "==> Proxy files:"
          find apiproxy -type f | sort

      - name: Create proxy zip bundle
        run: |
          echo "==> Creating proxy bundle ..."
          zip -r ${{ env.BUNDLE_ZIP }} apiproxy/

          echo "==> Bundle contents:"
          unzip -l ${{ env.BUNDLE_ZIP }}

      - name: Upload proxy zip bundle
        uses: actions/upload-artifact@v4
        with:
          name: proxy-zip-bundle
          path: ${{ env.BUNDLE_ZIP }}
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — DEPLOY TO APIGEE
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 4 · Deploy to Apigee Eval
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download zipped proxy bundle
        uses: actions/download-artifact@v4
        with:
          name: proxy-zip-bundle

      - name: Verify downloaded bundle
        run: |
          echo "==> Current directory:"
          pwd

          echo "==> Files:"
          ls -R

          echo "==> ZIP contents:"
          unzip -l ${{ env.BUNDLE_ZIP }}

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Import proxy bundle to Apigee
        id: import
        run: |
          echo "==> Importing bundle to Apigee org: ${{ secrets.APIGEE_ORG }} ..."

          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/apis?action=import&name=${{ env.PROXY_NAME }}&validate=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${{ env.BUNDLE_ZIP }}")

          echo "==> Import response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          REVISION=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)

          if 'error' in data:
              print(data['error']['message'], file=sys.stderr)
              sys.exit(1)

          rev = data.get('revision')

          if not rev:
              print('Revision missing', file=sys.stderr)
              sys.exit(1)

          print(rev)
          ")

          echo "==> Revision: $REVISION"

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy proxy revision
        run: |
          REVISION="${{ steps.import.outputs.revision }}"

          echo "==> Deploying revision $REVISION ..."

          RESPONSE=$(curl -s -X POST \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/revisions/${REVISION}/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Length: 0")

          echo "==> Deployment response:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

          STATE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('state', 'UNKNOWN'))
          ")

          echo "==> Deployment state: $STATE"

          if [ "$STATE" = "READY" ] || [ "$STATE" = "PROGRESSING" ]; then
            echo "==> Deployment successful."
          else
            echo "::warning::Deployment state is $STATE"
          fi

      - name: Verify deployment
        run: |
          echo "==> Verifying deployment ..."

          RESPONSE=$(curl -s \
            "https://apigee.googleapis.com/v1/organizations/${{ secrets.APIGEE_ORG }}/environments/${{ secrets.APIGEE_ENV }}/apis/${{ env.PROXY_NAME }}/deployments" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}")

          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"

      - name: Deployment summary
        run: |
          echo "=================================================="
          echo "Proxy Name : ${{ env.PROXY_NAME }}"
          echo "Org        : ${{ secrets.APIGEE_ORG }}"
          echo "Environment: ${{ secrets.APIGEE_ENV }}"
          echo "Revision   : ${{ steps.import.outputs.revision }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "=================================================="
